<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, #eaf6ff, #cfe6f7);
    font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage { width: min(94vw, 980px); position: relative; }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(23, 78, 125, .22);
    background: #cfeafc;
  }

  /* ---- 控制条 ---- */
  .controls {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;              /* 仅极窄屏时才兜底换行 */
    justify-content: center;
    width: max-content;           /* 宽度按内容撑开，避免被 left: 50% 截断而换行 */
    max-width: calc(100% - 24px); /* 不超出卡片范围 */
    gap: 8px;
    padding: 8px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 26px rgba(15, 50, 80, 0.25);
    user-select: none;
  }
  .controls button {
    border: 0;
    cursor: pointer;
    padding: 9px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    color: #17324d;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(20, 60, 100, 0.15);
    transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }
  .controls button:hover {
    transform: translateY(-1px);
    background: #ffffff;
    box-shadow: 0 4px 12px rgba(20, 60, 100, 0.22);
  }
  .controls button:active { transform: translateY(0) scale(0.97); }
  .controls button.active { background: #2a9d8f; color: #ffffff; }
  #btnDayNight.active { background: #1c2f57; }

  /* ---- 昼夜切换：CSS 过渡（独立于 SMIL 时钟，暂停时也可切换）---- */
  .sun, .moon, .stars, .veil, .headlight { transition: opacity 0.8s ease; }
  .moon, .stars, .veil, .headlight { opacity: 0; }
  #scene.night .sun { opacity: 0; }
  #scene.night .moon,
  #scene.night .stars,
  #scene.night .veil,
  #scene.night .headlight { opacity: 1; }

  /* ---- 星星闪烁 ---- */
  @keyframes twinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  .star { animation: twinkle 2.6s ease-in-out infinite; }
  .star:nth-child(2n) { animation-duration: 3.6s; animation-delay: -1.1s; }
  .star:nth-child(3n) { animation-duration: 2.1s; animation-delay: -1.7s; }
  #scene.paused .star { animation-play-state: paused; }
</style>
</head>
<body>
<main class="stage">
<svg id="scene" viewBox="0 0 900 520" role="img" aria-label="一只鹈鹕骑着自行车在原野公路上飞驰">

  <div class="controls" role="group" aria-label="动画控制">
    <button id="btnDayNight" type="button">🌙 切换到夜晚</button>

    <button id="btnSpeed" type="button">⚡ 1×</button>
  </div>
</main>

<script>
  (function () {
    var svg = document.getElementById('scene');
    var btnDayNight = document.getElementById('btnDayNight');
    var btnPause = document.getElementById('btnPause');
    var btnSpeed = document.getElementById('btnSpeed');

    /* 接管 SMIL 时钟：暂停浏览器自带时间线，改由 rAF 推进，实现暂停与倍速 */
    svg.pauseAnimations();
    var clock = svg.getCurrentTime();
    var speed = 1;
    var paused = false;
    var last = performance.now();

    function tick(now) {
      var dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      if (!paused) {
        clock += dt * speed;
        svg.setCurrentTime(clock);
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    /* 昼夜切换 */
    var night = false;
    btnDayNight.addEventListener('click', function () {
      night = !night;
      svg.classList.toggle('night', night);
      btnDayNight.textContent = night ? '☀️ 切换到白天' : '🌙 切换到夜晚';
      btnDayNight.classList.toggle('active', night);
    });

    /* 暂停 / 继续 */
    btnPause.addEventListener('click', function () {
      paused = !paused;
      svg.classList.toggle('paused', paused);
      btnPause.textContent = paused ? '▶️ 继续' : '⏸ 暂停';
      btnPause.classList.toggle('active', paused);
    });

    /* 倍速循环：1× → 2× → 3× → 0.5× → 1× */
    var speeds = [1, 2, 3, 0.5];
    var si = 0;
    btnSpeed.addEventListener('click', function () {
      si = (si + 1) % speeds.length;
      speed = speeds[si];
      btnSpeed.textContent = '⚡ ' + speed + '×';
      btnSpeed.classList.toggle('active', speed !== 1);
    });
  })();
</script>
</body>
</html>
