<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican Bike 🚲 | SVG 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 28px 16px;
    font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #eaf4ff;
    background: radial-gradient(1100px 600px at 50% -10%, #2b6595, #12304f 75%);
  }

  h1 {
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ffd166, #ff8f3c, #7ec8ef);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub { opacity: .85; font-size: .95rem; }

  .card {
    width: min(880px, 96vw);
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  }

  svg { display: block; width: 100%; height: auto; }

  button {
    font: inherit;
    font-size: .95rem;
    color: #12304f;
    background: #ffd166;
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .3);
    transition: transform .15s ease, background .2s ease;
  }
  button:hover { transform: translateY(-2px); background: #ffe08a; }
  button:active { transform: translateY(0); }

  footer { font-size: .8rem; opacity: .65; }

  body.paused svg * { animation-play-state: paused !important; }

  /* ============ 动画关键帧 ============ */
  @keyframes spin     { to { transform: rotate(360deg); } }
  @keyframes bob      { 0%, 100% { transform: translateY(0) rotate(0deg); }
                        50%      { transform: translateY(-3px) rotate(.5deg); } }
  @keyframes flap     { 0%, 100% { transform: rotate(6deg); }
                        50%      { transform: rotate(-34deg); } }
  @keyframes beak     { 0%, 80%, 100% { transform: rotate(0deg); }
                        8%   { transform: rotate(10deg); }
                        14%  { transform: rotate(1deg); }
                        22%  { transform: rotate(8deg); } }
  @keyframes fishwag  { 0%, 100% { transform: rotate(-4deg); }
                        50%      { transform: rotate(6deg); } }
  @keyframes tailwag  { 0%, 100% { transform: rotate(-5deg); }
                        50%      { transform: rotate(6deg); } }
  @keyframes sunspin  { to { transform: rotate(360deg); } }
  @keyframes cloudmove{ from { transform: translateX(0); }
                        to   { transform: translateX(-2400px); } }
  @keyframes gullmove { from { transform: translateX(0); }
                        to   { transform: translateX(-2600px); } }
  @keyframes gullflap { 0%, 100% { transform: rotate(-12deg); }
                        50%      { transform: rotate(12deg); } }
  @keyframes wavex    { from { transform: translateX(-14px); }
                        to   { transform: translateX(14px); } }
  @keyframes glint    { 0%, 100% { opacity: .15; }
                        50%      { opacity: .85; } }
  @keyframes roadmove { to { stroke-dashoffset: -95; } }
  @keyframes speedline{ 0%   { opacity: 0; transform: translateX(40px); }
                        25%  { opacity: .9; }
                        100% { opacity: 0; transform: translateX(-110px); } }
  @keyframes boatbob  { from { transform: translateY(0); }
                        to   { transform: translateY(-5px); } }

  /* ============ 动画应用 ============ */
  .wheel    { animation: spin .7s linear infinite; }
  .crank    { animation: spin .7s linear infinite; }
  .crank2   { animation: spin .7s linear infinite; animation-delay: -.35s; }
  .scene    { animation: bob .35s ease-in-out infinite;
              transform-box: fill-box; transform-origin: 50% 100%; }
  .wing     { animation: flap 1.1s ease-in-out infinite; }
  .beaklow  { animation: beak 2.4s ease-in-out infinite; }
  .fishbody { animation: fishwag 1.4s ease-in-out infinite; }
  .fishtail { animation: fishwag .5s ease-in-out infinite alternate; }
  .tailfeather { animation: tailwag 2s ease-in-out infinite alternate; }
  .sunray   { animation: sunspin 40s linear infinite; }
  .cloud    { animation-name: cloudmove; animation-timing-function: linear; animation-iteration-count: infinite; }
  .c1 { animation-duration: 55s; }
  .c2 { animation-duration: 75s; animation-delay: -30s; }
  .c3 { animation-duration: 63s; animation-delay: -14s; }
  .gullmove { animation: gullmove 26s linear infinite; }
  .gullmove.g2 { animation-duration: 34s; animation-delay: -10s; }
  .gullwing { animation: gullflap .7s ease-in-out infinite; }
  .wave     { animation: wavex 7s ease-in-out infinite alternate; }
  .wave.w2  { animation-duration: 9s; animation-delay: -3s; }
  .glint    { animation: glint 2.4s ease-in-out infinite; }
  .glint.g2 { animation-duration: 3s; animation-delay: -1s; }
  .glint.g3 { animation-duration: 3.6s; animation-delay: -2s; }
  .roadline { animation: roadmove 1.2s linear infinite; }
  .speed    { animation: speedline .9s linear infinite; }
  .speed.s2 { animation-delay: .3s; }
  .speed.s3 { animation-delay: .6s; }
  .boat     { animation: boatbob 3.2s ease-in-out infinite alternate; }
</style>
</head>
<body>

<h1>Pelican Bike</h1>
<p class="sub">🌊 海边骑行 · 纯 SVG + CSS 手绘 2D 动画</p>

<button id="toggle" type="button">⏸ 暂停动画</button>

<div class="card">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车在海边兜风">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54aede"/>
      <stop offset=".65" stop-color="#a8ddf2"/>
      <stop offset="1" stop-color="#eaf7fd"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e9ed4"/>
      <stop offset="1" stop-color="#86d4ec"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".65" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffb703"/>
    </radialGradient>
  </defs>

  <!-- ===== 背景：天空 ===== -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>
  <rect x="0" y="330" width="800" height="22" fill="url(#horizon)"/>

  <!-- 太阳 -->
  <g transform="translate(660,100)">
    <circle r="70" fill="#ffd166" opacity=".25"/>
    <circle r="46" fill="url(#sun)"/>
    <circle cx="-14" cy="-14" r="12" fill="#fff" opacity=".35"/>
    <g class="sunray" stroke="#ffd166" stroke-width="5" stroke-linecap="round" opacity=".9">
      <line y1="-56" y2="-76"/>
      <line y1="-56" y2="-76" transform="rotate(45)"/>
      <line y1="-56" y2="-76" transform="rotate(90)"/>
      <line y1="-56" y2="-76" transform="rotate(135)"/>
      <line y1="-56" y2="-76" transform="rotate(180)"/>
      <line y1="-56" y2="-76" transform="rotate(225)"/>
      <line y1="-56" y2="-76" transform="rotate(270)"/>
      <line y1="-56" y2="-76" transform="rotate(315)"/>
    </g>
  </g>

  <!-- 云 -->
  <g transform="translate(140,95)"><g class="cloud c1">
    <ellipse cx="0" cy="0" rx="48" ry="22" fill="#fff" opacity=".95"/>
    <ellipse cx="34" cy="-8" rx="30" ry="18" fill="#fff" opacity=".95"/>
    <ellipse cx="-36" cy="-5" rx="26" ry="15" fill="#fff" opacity=".95"/>
    <ellipse cx="-2" cy="10" rx="52" ry="13" fill="#e9f5fc"/>
  </g></g>
  <g transform="translate(430,70)"><g class="cloud c2">
    <ellipse cx="0" cy="0" rx="42" ry="19" fill="#fff" opacity=".9"/>
    <ellipse cx="30" cy="-7" rx="26" ry="16" fill="#fff" opacity=".9"/>
    <ellipse cx="-32" cy="-4" rx="23" ry="13" fill="#fff" opacity=".9"/>
    <ellipse cx="-2" cy="8" rx="46" ry="11" fill="#e9f5fc"/>
  </g></g>
  <g transform="translate(-260,150)"><g class="cloud c3">
    <ellipse cx="0" cy="0" rx="40" ry="17" fill="#fff" opacity=".85"/>
    <ellipse cx="28" cy="-6" rx="24" ry="14" fill="#fff" opacity=".85"/>
    <ellipse cx="-30" cy="-4" rx="22" ry="12" fill="#fff" opacity=".85"/>
    <ellipse cx="-1" cy="7" rx="43" ry="10" fill="#e9f5fc"/>
  </g></g>

  <!-- 海鸥 -->
  <g transform="translate(660,255)">
    <g class="gullmove"><g class="gullwing">
      <path d="M -12,0 Q -6,-7 0,0 Q 6,-7 12,0" fill="none" stroke="#33415c" stroke-width="2.5" stroke-linecap="round"/>
    </g></g>
  </g>
  <g transform="translate(920,190)">
    <g class="gullmove g2"><g class="gullwing">
      <path d="M -9,0 Q -4.5,-5 0,0 Q 4.5,-5 9,0" fill="none" stroke="#33415c" stroke-width="2" stroke-linecap="round"/>
    </g></g>
  </g>

  <!-- ===== 海面 ===== -->
  <rect x="0" y="345" width="800" height="155" fill="url(#sea)"/>
  <g fill="none">
    <path class="wave" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".5"
          d="M 0,352 Q 40,344 80,352 T 160,352 T 240,352 T 320,352 T 400,352 T 480,352 T 560,352 T 640,352 T 720,352 T 800,352"/>
    <path class="wave w2" stroke="#7fc8e8" stroke-width="2" stroke-linecap="round" opacity=".6"
          d="M 0,382 Q 40,374 80,382 T 160,382 T 240,382 T 320,382 T 400,382 T 480,382 T 560,382 T 640,382 T 720,382 T 800,382"/>
  </g>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line class="glint"    x1="560" y1="390" x2="590" y2="390"/>
    <line class="glint g2" x1="620" y1="406" x2="648" y2="406"/>
    <line class="glint g3" x1="700" y1="383" x2="728" y2="383"/>
  </g>

  <!-- 小帆船 -->
  <g transform="translate(608,352)">
    <g class="boat">
      <path d="M -14,8 L 14,8 L 8,16 L -8,16 Z" fill="#6b4a2f"/>
      <line x1="0" y1="8" x2="0" y2="-22" stroke="#5a3d26" stroke-width="2"/>
      <path d="M 0,-22 C 10,-16 12,-4 0,8 Z" fill="#fdfaf4" stroke="#c9b79c" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ===== 海滨道路 ===== -->
  <rect x="0" y="412" width="800" height="18" fill="#ead8a6"/>
  <rect x="0" y="412" width="800" height="2" fill="#d9c48f"/>
  <rect x="0" y="430" width="800" height="70" fill="#3d4354"/>
  <rect x="0" y="430" width="800" height="3" fill="#59617a"/>
  <line class="roadline" x1="0" y1="465" x2="800" y2="465"
        stroke="#cfd6e0" stroke-width="4" stroke-linecap="round" stroke-dasharray="46 49" opacity=".85"/>

  <!-- 地面阴影与速度线 -->
  <ellipse cx="395" cy="434" rx="185" ry="7" fill="#16283d" opacity=".14"/>
  <g stroke="#9fb2c8" stroke-width="4" stroke-linecap="round" opacity=".8">
    <line class="speed"    x1="150" y1="238" x2="215" y2="238"/>
    <line class="speed s2" x1="105" y1="272" x2="175" y2="272"/>
    <line class="speed s3" x1="165" y1="306" x2="235" y2="306"/>
  </g>

  <!-- ===== 主体：自行车 + 鹈鹕（整体弹跳） ===== -->
  <g class="scene">

    <!-- 后轮 -->
    <g transform="translate(255,375)">
      <g class="wheel">
        <circle r="55" fill="none" stroke="#2c2f36" stroke-width="9"/>
        <circle r="48" fill="none" stroke="#454b58" stroke-width="2"/>
        <g stroke="#9aa5b4" stroke-width="2">
          <line y1="-7" y2="-47"/>
          <line y1="-7" y2="-47" transform="rotate(60)"/>
          <line y1="-7" y2="-47" transform="rotate(120)"/>
          <line y1="-7" y2="-47" transform="rotate(180)"/>
          <line y1="-7" y2="-47" transform="rotate(240)"/>
          <line y1="-7" y2="-47" transform="rotate(300)"/>
        </g>
        <circle r="7" fill="#4a4f5a"/>
        <circle r="3" fill="#c8d0da"/>
        <circle cy="-55" r="2.6" fill="#e8ecf2"/>
        <circle cy="-55" r="2.6" fill="#e8ecf2" transform="rotate(120)"/>
        <circle cy="-55" r="2.6" fill="#e8ecf2" transform="rotate(240)"/>
      </g>
    </g>
    <path d="M 198,354 A 60 60 0 0 1 311,354" fill="none" stroke="#24405e" stroke-width="6" stroke-linecap="round"/>
    <line x1="255" y1="320" x2="255" y2="366" stroke="#24405e" stroke-width="3"/>

    <!-- 前轮 -->
    <g transform="translate(535,375)">
      <g class="wheel">
        <circle r="55" fill="none" stroke="#2c2f36" stroke-width="9"/>
        <circle r="48" fill="none" stroke="#454b58" stroke-width="2"/>
        <g stroke="#9aa5b4" stroke-width="2">
          <line y1="-7" y2="-47"/>
          <line y1="-7" y2="-47" transform="rotate(60)"/>
          <line y1="-7" y2="-47" transform="rotate(120)"/>
          <line y1="-7" y2="-47" transform="rotate(180)"/>
          <line y1="-7" y2="-47" transform="rotate(240)"/>
          <line y1="-7" y2="-47" transform="rotate(300)"/>
        </g>
        <circle r="7" fill="#4a4f5a"/>
        <circle r="3" fill="#c8d0da"/>
        <circle cy="-55" r="2.6" fill="#e8ecf2"/>
        <circle cy="-55" r="2.6" fill="#e8ecf2" transform="rotate(120)"/>
        <circle cy="-55" r="2.6" fill="#e8ecf2" transform="rotate(240)"/>
      </g>
    </g>
    <path d="M 478,354 A 60 60 0 0 1 591,354" fill="none" stroke="#24405e" stroke-width="6" stroke-linecap="round"/>
    <line x1="535" y1="320" x2="535" y2="366" stroke="#24405e" stroke-width="3"/>

    <!-- 车架 -->
    <g stroke="#e63946" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M 255,375 L 325,268"/>
      <path d="M 255,375 L 395,375"/>
      <path d="M 325,268 L 395,375"/>
      <path d="M 395,375 L 512,262"/>
      <path d="M 325,268 L 505,258"/>
      <path d="M 512,262 L 535,375"/>
    </g>
    <line x1="325" y1="276" x2="336" y2="340" stroke="#4a4f5a" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="325" cy="270" rx="27" ry="10" fill="#24405e" stroke="#16283d" stroke-width="2"/>
    <path d="M 505,258 C 512,245 528,242 537,252" fill="none" stroke="#33384a" stroke-width="6" stroke-linecap="round"/>
    <line x1="537" y1="252" x2="546" y2="258" stroke="#33384a" stroke-width="8" stroke-linecap="round"/>

    <!-- 链条与链轮 -->
    <path d="M 395,361 L 255,367 M 395,389 L 255,383" stroke="#4a4f5a" stroke-width="3" fill="none"/>
    <circle cx="395" cy="375" r="16" fill="#3a3f4a"/>
    <circle cx="395" cy="375" r="6" fill="#b8c0cc"/>
    <circle cx="255" cy="375" r="9" fill="#3a3f4a"/>

    <!-- 曲柄与腿（近侧） -->
    <g transform="translate(395,375)">
      <g class="crank">
        <line x1="0" y1="0" x2="38" y2="0" stroke="#4a4f5a" stroke-width="5"/>
        <path d="M 38,0 C 22,-38 6,-72 -32,-105" fill="none" stroke="#f28c1e" stroke-width="15" stroke-linecap="round"/>
        <rect x="26" y="-6" width="24" height="12" rx="3" fill="#33384a"/>
        <ellipse cx="46" cy="-2" rx="11" ry="6" fill="#f28c1e" stroke="#d97706" stroke-width="1.5"/>
      </g>
    </g>

    <!-- 曲柄与腿（远侧，相位差 180°） -->
    <g transform="translate(395,375)">
      <g class="crank crank2">
        <line x1="0" y1="0" x2="-38" y2="0" stroke="#4a4f5a" stroke-width="5"/>
        <path d="M -38,0 C -22,-38 -6,-72 32,-105" fill="none" stroke="#d97706" stroke-width="15" stroke-linecap="round"/>
        <rect x="-50" y="-6" width="24" height="12" rx="3" fill="#33384a"/>
        <ellipse cx="-46" cy="-2" rx="11" ry="6" fill="#d97706" stroke="#b45f04" stroke-width="1.5"/>
      </g>
    </g>

    <!-- 鹈鹕（坐在车座上） -->
    <g transform="translate(325,268)">
      <!-- 尾巴 -->
      <g transform="translate(-82,-45)">
        <g class="tailfeather">
          <path d="M 0,0 C -22,-14 -38,-8 -52,6 C -36,8 -22,14 0,6 Z" fill="#f1e7d2" stroke="#c9b79c" stroke-width="2.5"/>
          <path d="M -8,-2 C -22,-10 -32,-4 -42,8 M -6,2 C -18,-2 -28,6 -38,14" fill="none" stroke="#d5c5a5" stroke-width="2"/>
        </g>
      </g>

      <!-- 身体 -->
      <ellipse cx="-15" cy="-50" rx="80" ry="50" fill="#fbf7ee" stroke="#c9b79c" stroke-width="2.5"/>
      <path d="M 52,-70 C 64,-74 72,-72 78,-66" fill="none" stroke="#e8ddc8" stroke-width="2"/>

      <!-- 脖子 -->
      <path d="M 58,-84 C 78,-102 88,-118 94,-126" fill="none" stroke="#c9b79c" stroke-width="34" stroke-linecap="round"/>
      <path d="M 58,-84 C 78,-102 88,-118 94,-126" fill="none" stroke="#fbf7ee" stroke-width="28" stroke-linecap="round"/>

      <!-- 拍打的翅膀 -->
      <g transform="translate(8,-68)">
        <g class="wing">
          <path d="M 0,0 C -20,-30 -52,-42 -84,-30 C -80,-14 -56,-4 -28,2 C -18,4 -8,3 0,0 Z"
                fill="#f5ecdb" stroke="#c9b79c" stroke-width="2.5"/>
          <path d="M -30,-2 L -64,-20 M -34,-10 L -68,-30 M -24,5 L -54,-6"
                fill="none" stroke="#d5c5a5" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 头 -->
      <circle cx="94" cy="-128" r="26" fill="#fbf7ee" stroke="#c9b79c" stroke-width="2.5"/>
      <path d="M 102,-151 C 107,-163 115,-165 121,-171 M 99,-149 C 103,-159 107,-161 111,-167"
            fill="none" stroke="#c9b79c" stroke-width="3" stroke-linecap="round"/>
      <circle cx="107" cy="-135" r="5.2" fill="#23272f"/>
      <circle cx="108.8" cy="-137" r="1.7" fill="#fff"/>
      <circle cx="116" cy="-122" r="5" fill="#ffd8c8" opacity=".75"/>

      <!-- 上喙 -->
      <path d="M 118,-139 C 150,-147 184,-141 200,-130 C 184,-125 158,-128 118,-133 Z"
            fill="#ffb300" stroke="#dd8f00" stroke-width="2"/>

      <!-- 下喙 + 大喉囊（开合动画） -->
      <g transform="translate(118,-136)">
        <g class="beaklow">
          <path d="M 0,2 C 32,8 58,12 74,16 C 60,22 34,20 0,10 Z"
                fill="#ff9800" stroke="#dd8f00" stroke-width="1.5"/>
          <ellipse cx="76" cy="34" rx="42" ry="28" fill="#ff8f3c" stroke="#e0782c" stroke-width="2" opacity=".96"/>
          <path d="M 40,26 Q 74,58 112,26" fill="none" stroke="#e0782c" stroke-width="2" opacity=".7"/>
          <ellipse cx="62" cy="26" rx="10" ry="6" fill="#ffb36b" opacity=".8"/>
        </g>
      </g>

      <!-- 嘴里叼着的小鱼 -->
      <g transform="translate(162,-124)">
        <g class="fishbody">
          <ellipse cx="18" cy="0" rx="23" ry="8.5" fill="#5fb0dc" stroke="#3381b5" stroke-width="2"/>
          <path d="M 12,-8 C 16,-15 22,-15 24,-10 Z" fill="#3381b5"/>
          <circle cx="7" cy="-2" r="2" fill="#16324a"/>
          <line x1="13" y1="-6" x2="15" y2="6" stroke="#3381b5" stroke-width="1.5" opacity=".7"/>
          <g transform="translate(38,0)">
            <g class="fishtail">
              <path d="M 0,0 C 4,-2 10,-6 15,-11 C 11,-2 11,2 15,11 C 10,6 4,2 0,0 Z"
                    fill="#3381b5" stroke="#2a6f9d" stroke-width="1.5"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
</div>

<footer>纯 SVG + CSS 手绘动画 · 无外部依赖</footer>

<script>
  const btn = document.getElementById('toggle');
  btn.addEventListener('click', () => {
    document.body.classList.toggle('paused');
    btn.textContent = document.body.classList.contains('paused') ? '▶ 播放动画' : '⏸ 暂停动画';
  });
</script>
</body>
</html>
