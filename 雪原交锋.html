<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>雪原交锋</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      color: #eaf2f7;
      background: #0a1420;
      --accent: #a6e0e6;
      --muted: #a5b8c9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 5%, #192d3f 0%, transparent 66%), #0a1420;
    }
    main { width: min(1200px, calc(100% - 64px)); margin: auto; padding: 42px 0 40px; }
    header { display: flex; align-items: center; gap: 17px; margin: 0 0 23px; }
    .emblem {
      width: 42px; height: 42px; display: grid; place-items: center; flex: none;
      border: 1px solid #50758a; transform: rotate(45deg); border-radius: 9px;
      background: #1d3546; color: #b8eaf0; margin: 0 7px;
    }
    .emblem svg { width: 27px; height: 27px; transform: rotate(-45deg); }
    h1 {
      margin: 0; font: 750 clamp(31px, 4.5vw, 50px)/1.12 "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
      letter-spacing: .09em;
    }
    .cast { margin: 7px 0 0; color: var(--muted); font-size: 13px; letter-spacing: .17em; }
    .player {
      border: 1px solid #344c60; border-radius: 19px; overflow: hidden;
      background: #101e2c; box-shadow: 0 22px 80px #030a13a8;
    }
    .scene { display: block; width: 100%; height: auto; background: #234763; }
    .controls { display: grid; grid-template-columns: auto 1fr; gap: 21px; align-items: center; padding: 18px 24px 20px; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid #fff2bd; outline-offset: 4px; }
    #play {
      min-height: 48px; min-width: 100px; padding: 0 12px; display: inline-flex; align-items: center;
      justify-content: center; gap: 7px; color: #102735; background: var(--accent); border-radius: 10px;
      border: 0; font-size: 14px; font-weight: 750; white-space: nowrap;
    }
    #play:hover { background: #c5f2f2; }
    #play svg { width: 20px; height: 20px; }
    #play [hidden] { display: none; }
    .transport { min-width: 0; }
    .seek { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
    #progress {
      --progress: 0%; margin: 0; width: 100%; min-width: 0; height: 24px;
      appearance: none; background: transparent; cursor: pointer; touch-action: none;
    }
    #progress::-webkit-slider-runnable-track {
      height: 5px; border-radius: 10px;
      background: linear-gradient(to right, var(--accent) var(--progress), #3b5265 var(--progress));
    }
    #progress::-webkit-slider-thumb {
      appearance: none; margin-top: -5px; width: 15px; height: 15px; border: 2px solid #152735;
      border-radius: 50%; background: #d9fcfa; box-shadow: 0 0 0 1px #7db9c4;
    }
    #progress::-moz-range-track { height: 5px; border-radius: 10px; background: #3b5265; }
    #progress::-moz-range-progress { height: 5px; border-radius: 10px; background: var(--accent); }
    #progress::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: #d9fcfa; border: 2px solid #152735; box-shadow: 0 0 0 1px #7db9c4; }
    .time { color: #ccdae6; font: 12px/1 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: nowrap; }
    .time span { color: #91aabd; }
    .chapters { display: grid; grid-template-columns: 4.25fr 4.25fr 5.5fr; gap: 5px; }
    .chapters button {
      min-width: 0; padding: 5px 3px 0; text-align: left; color: var(--muted); font-size: 12px;
      border: 0; border-top: 1px solid #344b5d; background: transparent; white-space: nowrap;
    }
    .chapters button:hover, .chapters button[aria-current="true"] { color: #d3f5f6; border-color: #83bec9; }
    .shortcut { text-align: right; margin: 12px 1px 0; color: var(--muted); font-size: 12px; }
    kbd { font: inherit; border: 1px solid #405a6e; border-radius: 4px; padding: 1px 4px; margin-right: 5px; }
    @media (max-width: 640px) {
      main { width: calc(100% - 24px); padding: 28px 0 20px; }
      header { margin-bottom: 18px; gap: 11px; }
      .emblem { width: 31px; height: 31px; border-radius: 6px; }
      .emblem svg { width: 22px; height: 22px; }
      .cast { font-size: 11px; }
      .player { border-radius: 12px; }
      .controls { padding: 10px; gap: 9px; }
      #play { min-width: 71px; min-height: 43px; padding: 0 6px; gap: 2px; font-size: 12px; }
      #play svg { width: 17px; height: 17px; }
      .seek { gap: 7px; }
      .time { font-size: 10px; }
      .chapters { gap: 3px; }
      .chapters button { padding-inline: 0; font-size: 11px; }
    }
    @media (pointer: coarse) { .shortcut { display: none; } }
  </style>
</head>

<script>
  (() => {
    'use strict';

    const duration = 14;
    const fireStart = 4.25;
    const fallStart = 8.5;
    const landingTime = 9.62;
    const shotTimes = [4.39, 4.56, 4.75, 4.93, 5.37, 5.54, 5.73, 5.92,
      6.39, 6.57, 6.76, 6.96, 7.48, 7.66, 7.85, 8.04, 8.26];
    const flightTime = .21;
    const walkPeriod = 1.24;
    const bearScale = .98;
    const tigaScale = .88;
    const tau = Math.PI * 2;
    const svgNS = 'http://www.w3.org/2000/svg';
    const byId = (id) => document.getElementById(id);
    const clamp = (value) => Math.max(0, Math.min(1, value));
    const blend = (start, end, amount) => start + (end - start) * amount;
    const smooth = (value) => {
      const amount = clamp(value);
      return amount * amount * (3 - 2 * amount);
    };
    const wrap = (value, length) => ((value % length) + length) % length;
    const rotatePoint = (x, y, degrees) => {
      const angle = degrees * Math.PI / 180;
      return { x: x * Math.cos(angle) - y * Math.sin(angle), y: x * Math.sin(angle) + y * Math.cos(angle) };
    };
    function attrs(element, values) {
      for (const [name, value] of Object.entries(values)) element.setAttribute(name, value);
    }
    function make(tag, parent, values = {}) {
      const element = document.createElementNS(svgNS, tag);
      attrs(element, values);
      parent.append(element);
      return element;
    }

    let randomSeed = 17253;
    function rand() {
      randomSeed = (Math.imul(1664525, randomSeed) + 1013904223) >>> 0;
      return randomSeed / 4294967296;
    }
    const scene = Object.fromEntries([
      'sky-motion', 'ground-wind', 'bear-rider', 'bear-shadow', 'bear-head', 'emperor', 'cape-back',
      'cape-fold', 'cape-hem', 'crown-beads', 'weapon-pose', 'weapon', 'tiga', 'tiga-shadow',
      'tiga-head', 'tiga-light', 'tiga-left-arm', 'tiga-right-arm', 'tiga-left-leg', 'tiga-right-leg', 'muzzle'
    ].map((id) => [id, byId(id)]));

    for (let i = 0; i < 71; i++) {
      make('circle', byId('stars'), { cx: rand() * 1200, cy: rand() * 209,
        r: blend(.45, 1.35, rand()), opacity: blend(.18, .67, rand()) });
    }
    for (let i = 0; i < 98; i++) {
      const x = i * 12.6 + rand() * 12 - 15;
      const y = 334 - Math.sin(x * .005) * 10 + rand() * 9;
      make('use', byId('distant-firs'), { href: '#fir', transform: `translate(${x} ${y}) scale(${blend(.18, .64, rand())})` });
    }
    for (let i = 0; i < 250; i++) {
      const y = blend(374, 568, rand());
      make('ellipse', byId('snow-grain'), { cx: rand() * 1200, cy: y,
        rx: blend(.7, 3.8, rand()), ry: blend(.22, .82, rand()), opacity: blend(.12, .38, rand()) });
    }

    const legs = [
      { element: byId('far-hind'), x: -86, y: -65, offset: .15, stride: 12 },
      { element: byId('far-front'), x: 74, y: -63, offset: .62, stride: 13 },
      { element: byId('near-hind'), x: -79, y: -60, offset: .65, stride: 15 },
      { element: byId('near-front'), x: 57, y: -62, offset: .12, stride: 16 }
    ];
    const flakes = Array.from({ length: 112 }, (_, index) => {
      const near = index >= 85;
      return { element: make('circle', byId('snowflakes'), { r: near ? blend(1.4, 2.9, rand()) : blend(.45, 1.45, rand()) }),
        x: rand() * 1232, y: rand() * 589, vx: near ? blend(47, 78, rand()) : blend(10, 38, rand()),
        vy: near ? blend(27, 44, rand()) : blend(10, 27, rand()), drift: rand() * tau,
        opacity: near ? blend(.19, .55, rand()) : blend(.24, .67, rand()) };
    });

    function bearPose(time) {
      const effort = (1 - .49 * smooth((time - 3.65) / 1.3)) * (1 - smooth((time - 11.65) / 1.56));
      const stride = time / walkPeriod;
      const bob = -Math.cos(stride * tau * 2) * 1.65 * effort;
      const easedDistance = time >= 0 ? 184 * (1 - Math.exp(-time / 7.7)) : 23.9 * time;
      return { x: 219 + easedDistance, y: 450 + bob - easedDistance * .019, stride, effort, bob,
        riderAngle: Math.sin(stride * tau) * effort * 1.35,
        riderY: -109 + Math.sin(stride * tau * 2 + .6) * 1.15 * effort };
    }
    const prints = legs.flatMap((leg, index) => {
      return Array.from({ length: 14 }, (_, step) => {
        const time = (step - 3 + .50 - leg.offset) * walkPeriod;
        const pose = bearPose(time);
        const x = pose.x + bearScale * (leg.x + (index % 2 ? 2 : -7));
        const y = 454 - (pose.x - 219) * .019 + (index > 1 ? 4 : -2);
        const element = make('use', byId('tracks'), { href: '#track',
          transform: `translate(${x} ${y}) scale(${index > 1 ? 1 : .72})` });
        const puff = make('circle', byId('foot-snow'), { fill: 'url(#powder)', opacity: 0 });
        return { time, x, y, element, puff };
      });
    });

    function shotAge(time, offset) {
      let latest = Infinity;
      for (const moment of shotTimes) {
        const age = time - (moment + offset);
        if (age >= 0) latest = age;
      }
      return latest;
    }

    function weaponPose(time) {
      const lift = smooth((time - 3.02) / 1.26);
      const lower = smooth((time - 8.55) / 1.05);
      const recoil = Math.exp(-shotAge(time, 0) * 22);
      const sweep = Math.sin((time - fireStart) * 5.4) * 2.7 + Math.sin(time * 9.5) * .38;
      const angle = blend(11.5 + Math.sin(time * 4.8), 1.5 + sweep, lift * (1 - lower)) - 2.9 * recoil;
      return { angle, recoil };
    }

    function muzzlePoint(time) {
      const rider = bearPose(time);
      const weapon = weaponPose(time);
      const barrel = rotatePoint(184 - weapon.recoil * 5.1, -3, weapon.angle);
      const seat = rotatePoint(18 + barrel.x, -47 + barrel.y, rider.riderAngle);
      return { x: rider.x + bearScale * (-15 + seat.x), y: rider.y + bearScale * (rider.riderY + seat.y),
        angle: weapon.angle + rider.riderAngle };
    }

    function tigaPose(time) {
      const impactAge = shotAge(time, flightTime);
      const hit = Math.exp(-impactAge * 9);
      const fall = clamp((time - fallStart) / (landingTime - fallStart));
      const tip = fall ** 1.46;
      const grounded = smooth((time - landingTime) / .39);
      const stagger = smooth((time - 4.60) / 3.85);
      return {
        x: 931 + stagger * 18 + 48 * tip + hit * 4 * (1 - fall),
        y: 339.4 + 67 * fall ** 2 + hit * 2 * (1 - fall) + grounded * 2.7,
        angle: (Math.sin(time * 2.5) * 1.6 + hit * 11 + 5 * stagger) * (1 - tip) + tip * (94 - grounded * 6),
        hit, fall, grounded, stagger
      };
    }

    const shots = shotTimes.map((time, index) => {
      const start = muzzlePoint(time);
      const opponent = tigaPose(time + flightTime);
      const chest = rotatePoint(-9 + (index % 4) * 5, -33 + Math.sin(index * 1.98) * 8, opponent.angle);
      return {
        time, start, end: { x: opponent.x + chest.x * tigaScale, y: opponent.y + chest.y * tigaScale },
        trail: make('path', byId('tracers'), { stroke: '#fdbd6c', 'stroke-width': 5, opacity: 0 }),
        core: make('path', byId('tracers'), { stroke: '#ffefd0', 'stroke-width': 1.65, opacity: 0 }),
        flash: make('circle', byId('impact-sparks'), { fill: 'url(#flash)', opacity: 0 }),
        sparks: Array.from({ length: 7 }, () => ({
          element: make('path', byId('impact-sparks'), { stroke: rand() > .5 ? '#fff7d8' : '#d78455', 'stroke-width': blend(1.1, 2.1, rand()), opacity: 0 }),
          angle: rand() * tau, speed: blend(50, 180, rand())
        })),
        smoke: make('circle', byId('muzzle-smoke'), { fill: 'url(#powder)', opacity: 0 })
      };
    });
    const landingSnow = Array.from({ length: 31 }, (_, i) => ({
      element: make('circle', byId('landing-snow'), { fill: i < 13 ? 'url(#powder)' : '#eff9fd', opacity: 0 }),
      startX: blend(926, 1056, rand()), speed: blend(-126, 130, rand()), height: blend(14, 50, rand()),
      radius: i < 13 ? blend(12, 32, rand()) : blend(1, 4.2, rand()), delay: rand() * .24, dust: i < 13
    }));

    function animateBear(time) {
      const pose = bearPose(time);
      attrs(scene['bear-rider'], { transform: `translate(${pose.x} ${pose.y}) scale(${bearScale})` });
      attrs(scene['bear-shadow'], { cx: pose.x + 18, cy: pose.y - pose.bob + 4, rx: 143 + pose.effort * 4 });
      for (const leg of legs) {
        const phase = (pose.stride + leg.offset) * tau;
        const swing = Math.cos(phase) * leg.stride * pose.effort;
        const lift = Math.max(0, Math.sin(phase)) * 10.5 * pose.effort;
        attrs(leg.element, { transform: `translate(${leg.x} ${leg.y - lift}) rotate(${swing})` });
      }
      attrs(scene['bear-head'], { transform: `rotate(${Math.sin(pose.stride * tau * 2 + .8) * 1.8 * pose.effort} 76 -99)` });
      attrs(scene.emperor, { transform: `translate(-15 ${pose.riderY}) rotate(${pose.riderAngle})` });
      const wave = Math.sin(time * 4.5) * 8 + Math.sin(time * 2.4) * 6;
      const tipX = -121 - Math.sin(time * 3.1) * 8;
      const tipY = 1 + wave;
      const hem = `M${tipX} ${tipY}Q-92 ${24 + wave * .58} -55 ${18 - wave * .25}L12 6`;
      attrs(scene['cape-back'], { d: `M-24-60C-58-49-74 ${tipY - 2} ${tipX} ${tipY}Q-92 ${24 + wave * .58} -55 ${18 - wave * .25}L12 6 8-59Z` });
      attrs(scene['cape-hem'], { d: hem });
      attrs(scene['cape-fold'], { d: `M-29-47Q-63 ${3 + wave * .63} ${tipX + 12} ${tipY + 4}m47-2q31-13 43-35` });
      attrs(scene['crown-beads'], { transform: `rotate(${Math.sin(time * 5.1) * 3.8} 8 -123)` });
      const { angle, recoil } = weaponPose(time);
      attrs(scene['weapon-pose'], { transform: `rotate(${angle})` });
      attrs(scene.weapon, { transform: `translate(${-recoil * 5.1} 0)` });
      for (const print of prints) {
        const age = time - print.time;
        const appeared = age >= 0 && print.time < 12.61;
        const puff = appeared ? clamp(1 - age / .33) : 0;
        attrs(print.element, { opacity: appeared ? (.34 + .56 * (1 - clamp(age / 19))) : 0 });
        attrs(print.puff, { cx: print.x + age * 8, cy: print.y - 1 - age * 27,
          r: Math.max(0, 6 + age * 23), opacity: puff * .69 });
      }
    }

    function animateTiga(time) {
      const pose = tigaPose(time);
      const { x, y, angle, hit, fall, grounded, stagger } = pose;
      const armSwing = Math.sin(time * 3.4) * 2.4;
      attrs(scene.tiga, { transform: `translate(${x} ${y}) rotate(${angle}) scale(${tigaScale})` });
      attrs(scene['tiga-shadow'], { cx: x + 5 + fall * 9, rx: 30 + fall * 64, ry: 5 + fall * 2, opacity: .40 - fall * .13 });
      attrs(scene['tiga-head'], { transform: `rotate(${-9 - 6 * hit - 5 * stagger + fall * 17} 0 -69)` });
      attrs(scene['tiga-left-arm'], { transform: `rotate(${armSwing + 8 * stagger + 32 * hit + fall * 63 - grounded * 43} -30 -54)` });
      attrs(scene['tiga-right-arm'], { transform: `rotate(${-armSwing - 5 * stagger - 23 * hit - fall * 56 + grounded * 31} 30 -51)` });
      attrs(scene['tiga-left-leg'], { transform: `rotate(${1.7 * Math.sin(time * 2.9) * (1 - fall) + fall * 10 - grounded * 9} -13 0)` });
      attrs(scene['tiga-right-leg'], { transform: `rotate(${3 * stagger - fall * 14 + grounded * 8} 12 0)` });
      attrs(scene['tiga-light'], { fill: time < fallStart ? '#a7fbff' : '#e6a4a6', opacity: 1 - fall * .49 - grounded * .29 });
      for (const snow of landingSnow) {
        const age = time - landingTime + .055 - snow.delay;
        const flight = clamp(age / (snow.dust ? 1.32 : .76));
        const visible = age >= 0 && flight < 1;
        const height = snow.dust ? flight * snow.height : Math.sin(flight * Math.PI) * snow.height;
        attrs(snow.element, { cx: snow.startX + snow.speed * flight, cy: 421 - height,
          r: snow.radius * (snow.dust ? .8 + flight * 1.15 : 1),
          opacity: visible ? (1 - flight) * smooth(flight * 13) * .92 : 0 });
      }
    }

    function animateShots(time) {
      const age = shotAge(time, 0);
      const muzzle = muzzlePoint(time);
      const flash = clamp(1 - age / .10);
      const scale = .48 + flash * .47;
      attrs(scene.muzzle, { transform: `translate(${muzzle.x} ${muzzle.y}) rotate(${muzzle.angle}) scale(${scale})`, opacity: flash });
      for (const shot of shots) {
        const elapsed = time - shot.time;
        const flying = elapsed >= 0 && elapsed < flightTime;
        const progress = clamp(elapsed / flightTime);
        const tail = Math.max(0, progress - .29);
        const fromX = blend(shot.start.x, shot.end.x, tail);
        const fromY = blend(shot.start.y, shot.end.y, tail);
        const toX = blend(shot.start.x, shot.end.x, progress);
        const toY = blend(shot.start.y, shot.end.y, progress);
        const path = `M${fromX} ${fromY}L${toX} ${toY}`;
        attrs(shot.trail, { d: path, opacity: flying ? .32 : 0 });
        attrs(shot.core, { d: path, opacity: flying ? .88 : 0 });
        const impactAge = time - (shot.time + flightTime);
        const sparked = impactAge >= 0 && impactAge < .33;
        attrs(shot.flash, { cx: shot.end.x, cy: shot.end.y, r: 15 + clamp(impactAge / .17) * 17,
          opacity: sparked ? clamp(1 - impactAge / .17) * .84 : 0 });
        for (const spark of shot.sparks) {
          const distance = clamp(impactAge / .33) * .33 * spark.speed;
          const dx = Math.cos(spark.angle);
          const dy = Math.sin(spark.angle);
          const ovalX = shot.end.x + dx * distance;
          const ovalY = shot.end.y + dy * distance + Math.max(0, impactAge) ** 2 * 102;
          attrs(spark.element, { opacity: sparked ? .86 * (1 - impactAge / .33) : 0,
            d: `M${ovalX} ${ovalY}l${dx * 7} ${dy * 7}` });
        }
        const smoke = clamp(elapsed / .88);
        attrs(shot.smoke, { cx: shot.start.x + smoke * 30, cy: shot.start.y - smoke * 27,
          r: 4 + smoke * 18, opacity: elapsed > 0 ? .36 * (1 - smoke) * smooth(smoke * 12) : 0 });
      }
    }

    function animateWeather(time) {
      attrs(scene['sky-motion'], { transform: `translate(${Math.sin(time * .34) * 13} ${Math.sin(time * .4) * 4})` });
      attrs(scene['ground-wind'], { transform: `translate(${time * 4.1} 0)` });
      for (const flake of flakes) {
        const x = wrap(flake.x + time * flake.vx + Math.sin(time * 1.65 + flake.drift) * 11, 1232) - 16;
        const y = wrap(flake.y + time * flake.vy, 589) - 12;
        attrs(flake.element, { cx: x, cy: y, opacity: flake.opacity });
      }
    }

    const progress = byId('progress');
    const play = byId('play');
    const elapsed = byId('elapsed');
    const playLabel = byId('play-label');
    const icons = ['play', 'pause', 'replay'].map((name) => byId(`${name}-icon`));
    const chapters = Array.from(document.querySelectorAll('.chapters button'));
    let time = 0;
    let playing = false;
    let scrubbing = false;
    let frameId = 0;
    let previousFrame = null;
    let lastReadout = '';
    let currentChapter = -1;
    let buttonMode = '';

    function updateControls() {
      const mode = playing ? 'pause' : time >= duration ? 'replay' : 'play';
      if (mode !== buttonMode) {
        const label = { play: '播放', pause: '暂停', replay: '重播' }[mode];
        playLabel.textContent = label;
        play.setAttribute('aria-label', `${label}动画`);
        for (const icon of icons) icon.toggleAttribute('hidden', icon.id !== `${mode}-icon`);
        buttonMode = mode;
      }
      const chapter = time < fireStart ? 0 : time < fallStart ? 1 : 2;
      if (chapter !== currentChapter) {
        chapters.forEach((button, index) => button.setAttribute('aria-current', String(chapter === index)));
        currentChapter = chapter;
      }
      const seconds = time.toFixed(1);
      if (seconds !== lastReadout) {
        elapsed.value = `00:${seconds.padStart(4, '0')}`;
        progress.setAttribute('aria-valuetext', `${seconds} 秒，共 ${duration} 秒`);
        lastReadout = seconds;
      }
      progress.value = time.toFixed(2);
      progress.style.setProperty('--progress', `${100 * time / duration}%`);
    }

    function render() {
      animateWeather(time);
      animateBear(time);
      animateTiga(time);
      animateShots(time);
      updateControls();
    }

    function tick(now) {
      if (!playing) return;
      if (!scrubbing && previousFrame !== null) time = Math.min(duration, time + Math.min(.08, (now - previousFrame) / 1000));
      previousFrame = now;
      if (time >= duration) playing = false;
      if (!scrubbing) render();
      frameId = playing ? requestAnimationFrame(tick) : 0;
    }

    function togglePlayback() {
      playing = !playing;
      if (playing) {
        if (time >= duration) time = 0;
        previousFrame = null;
        frameId = requestAnimationFrame(tick);
      } else {
        cancelAnimationFrame(frameId);
        frameId = 0;
      }
      render();
    }

    function seek(value) {
      time = Math.max(0, Math.min(duration, value));
      if (time >= duration && playing) {
        playing = false;
        cancelAnimationFrame(frameId);
        frameId = 0;
      }
      render();
    }

    play.addEventListener('click', togglePlayback);
    progress.addEventListener('input', () => seek(progress.valueAsNumber));
    progress.addEventListener('pointerdown', () => { scrubbing = true; });
    function stopScrubbing() {
      scrubbing = false;
      previousFrame = null;
    }
    window.addEventListener('pointerup', stopScrubbing);
    window.addEventListener('pointercancel', stopScrubbing);
    window.addEventListener('blur', stopScrubbing);
    chapters.forEach((button) => button.addEventListener('click', () => seek(Number(button.dataset.time))));
    document.addEventListener('keydown', (event) => {
      if (event.code !== 'Space' || event.altKey || event.ctrlKey || event.metaKey ||
          event.target.closest?.('button, input:not([type=range]), a, textarea, select, [contenteditable]')) return;
      event.preventDefault();
      if (!event.repeat) togglePlayback();
    });
    render();
  })();
</script>
</body>
</html>
